<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* สไตล์สำหรับกล่องควบคุม GUI */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            width: 280px;
            user-select: none;
        }
        #ui-container h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- GUI สำหรับควบคุมแสงและการหมุนโมเดล -->
    <div id="ui-container">
        <h2>ควบคุมแสง</h2>
        
        <div class="control-group">
            <label>แนวแกน x: <span id="val-x">10</span></label>
            <input type="range" id="range-x" min="-30" max="30" step="0.5" value="10">
        </div>
        
        <div class="control-group">
            <label>แนวแกน y: <span id="val-y">10</span></label>
            <input type="range" id="range-y" min="0" max="30" step="0.5" value="10">
        </div>
        
        <div class="control-group">
            <label>แนวแกน z: <span id="val-z">10</span></label>
            <input type="range" id="range-z" min="-30" max="30" step="0.5" value="10">
        </div>
        
        <div class="control-group">
            <label>ระดับความเข้มของแสง: <span id="val-intensity">0.5</span></label>
            <input type="range" id="range-intensity" min="0" max="5" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label>ค่าแสงรวม: <span id="val-exposure">1</span></label>
            <input type="range" id="range-exposure" min="0.1" max="3" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>หมุนโมเดลแกน Y: <span id="val-rot-y">0</span>°</label>
            <input type="range" id="range-rot-y" min="-180" max="180" step="1" value="0">
        </div>
    </div>

    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // ตั้งค่า ToneMapping เพื่อรองรับการปรับค่า Exposure
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // ปรับแสง Ambient
        const ambientLight = new THREE.AmbientLight(0x404040, 0.1); 
        scene.add(ambientLight);
        
        // ปรับแสง Directional Light
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true; 
        scene.add(directionalLight);
        
        // สร้าง Group สำหรับเป็นจุดหมุน (Pivot) อยู่กับที่ตรงกลางฉาก
        const modelContainer = new THREE.Group();
        scene.add(modelContainer);

        let model2 = null;

        // เชื่อมโยงค่าจาก Slider
        const rangeX = document.getElementById('range-x');
        const rangeY = document.getElementById('range-y');
        const rangeZ = document.getElementById('range-z');
        const rangeIntensity = document.getElementById('range-intensity');
        const rangeExposure = document.getElementById('range-exposure');
        const rangeRotY = document.getElementById('range-rot-y');

        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const valZ = document.getElementById('val-z');
        const valIntensity = document.getElementById('val-intensity');
        const valExposure = document.getElementById('val-exposure');
        const valRotY = document.getElementById('val-rot-y');

        function updateLight() {
            const x = parseFloat(rangeX.value);
            const y = parseFloat(rangeY.value);
            const z = parseFloat(rangeZ.value);
            const intensity = parseFloat(rangeIntensity.value);
            const exposure = parseFloat(rangeExposure.value);

            directionalLight.position.set(x, y, z);
            directionalLight.intensity = intensity;
            renderer.toneMappingExposure = exposure;

            valX.innerText = x;
            valY.innerText = y;
            valZ.innerText = z;
            valIntensity.innerText = intensity;
            valExposure.innerText = exposure;
        }

        function updateModelRotation() {
            if (modelContainer) {
                const deg = parseFloat(rangeRotY.value);
                // หมุนที่ตัว Container (Group) รอบแกน Y อยู่กับที่
                modelContainer.rotation.y = THREE.MathUtils.degToRad(deg);
                valRotY.innerText = deg;
            }
        }

        rangeX.addEventListener('input', updateLight);
        rangeY.addEventListener('input', updateLight);
        rangeZ.addEventListener('input', updateLight);
        rangeIntensity.addEventListener('input', updateLight);
        rangeExposure.addEventListener('input', updateLight);
        rangeRotY.addEventListener('input', updateModelRotation);

        //belfast_sunset_puresky_1k.exr
        const exrSkyboxUrl = 'https://tin948.github.io/belfast_sunset_puresky_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // โหลดโมเดล GLB และนำใส่เข้าไปใน Group (modelContainer)
        const loader2 = new THREE.GLTFLoader();
        loader2.load('https://tin948.github.io/Remielle_Dan2.glb', (gltf) => {
            model2 = gltf.scene;
            model2.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model2.position.set(0, 0, 0); 
            
            // นำโมเดลใส่เข้าไปใน container กลางฉาก เพื่อให้หมุนอยู่กับที่
            modelContainer.add(model2);
            
            updateModelRotation();
        }, undefined, (error) => {
            console.error('An error happened while loading the GLTF:', error);
        });
        
        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://tin948.github.io/ptkdjy.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            doubleSided: true
        });
        const planeGeometry = new THREE.PlaneGeometry(30, 30);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        plane.position.set(0, -5, 0);
        scene.add(plane);

        // ฟังก์ชันสำหรับ Render และอัปเดตหน้าจออย่างต่อเนื่อง
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ปรับขนาดหน้าจออัตโนมัติเมื่อ Re-size window
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
